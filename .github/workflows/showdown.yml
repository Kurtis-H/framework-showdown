name: Showdown

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, with more runs, so flakiness shows up over time.
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      runs:
        description: Full runs of the test plan per framework
        default: "10"

permissions:
  contents: read

concurrency:
  group: showdown-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNS: ${{ github.event.inputs.runs || (github.event_name == 'schedule' && '10') || '3' }}
  DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/booking
  API_URL: http://localhost:8000
  WEB_URL: http://localhost:4173
  # Every framework's runs must pass this often, or the job fails.
  MIN_PASS_RATE: "0.8"

jobs:
  lint:
    name: Lint, typecheck and script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Tests for the measuring scripts
        run: python -m unittest discover -s tests -v
      - name: Typecheck Playwright
        working-directory: web/playwright
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: Typecheck Cypress
        working-directory: web/cypress
        env:
          CYPRESS_INSTALL_BINARY: "0"
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: Typecheck Appium
        working-directory: mobile/appium
        run: npm ci --no-audit --no-fund && npx tsc --noEmit
      - name: Check Maestro flows and scripts
        run: |
          pip install pyyaml
          python -c "import glob, yaml; [list(yaml.safe_load_all(open(f))) for f in glob.glob('mobile/maestro/**/*.yaml', recursive=True)]"
          for f in mobile/maestro/scripts/*.js; do node --check "$f"; done
          bash -n scripts/ci/*.sh

  web:
    name: "Web: ${{ matrix.framework }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        framework: [playwright, cypress]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Start the booking API (api-performance-lab)
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          python -m app.seed --events 14 --seats 12 --users 60
          PYTHONUNBUFFERED=1 RATE_LIMIT_PER_MINUTE=0 nohup uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$API_URL/health" && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Start booking-web
        run: |
          git clone --depth 1 https://github.com/Kurtis-H/booking-web ../booking-web
          cd ../booking-web && npm ci --no-audit --no-fund && npm run build
          nohup npx vite preview --port 4173 --strictPort > ../web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$WEB_URL" > /dev/null && exit 0; sleep 1; done
          cat ../web.log; exit 1
      - name: Install ${{ matrix.framework }} (timed)
        run: python scripts/measure.py setup --framework ${{ matrix.framework }} -- bash scripts/ci/setup.sh ${{ matrix.framework }}
      - name: Run the test plan ${{ env.RUNS }} times (timed)
        run: python scripts/measure.py run --framework ${{ matrix.framework }} --runs "$RUNS" -- bash "$GITHUB_WORKSPACE/scripts/ci/run.sh" ${{ matrix.framework }}
      - name: Rebuild booking-web with a planted bug
        run: |
          pkill -f "vite preview" || true
          while pgrep -f "vite preview" > /dev/null; do sleep 0.5; done
          cd ../booking-web && VITE_PLANTED_BUG=total npm run build
          nohup npx vite preview --port 4173 --strictPort > ../web-bug.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$WEB_URL" > /dev/null && exit 0; sleep 1; done
          cat ../web-bug.log; exit 1
      - name: Does it catch the planted bug? (exactly S3 must fail)
        run: python scripts/measure.py catch --framework ${{ matrix.framework }} --expect-fail S3 -- bash "$GITHUB_WORKSPACE/scripts/ci/run.sh" ${{ matrix.framework }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.framework }}
          path: |
            results/
            api.log
            web/playwright/test-results/
            web/cypress/cypress/screenshots/

  apk:
    name: Build the Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Kurtis-H/booking-mobile
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build (the emulator reaches the host's API at 10.0.2.2)
        run: |
          flutter build apk --profile --dart-define=API_URL=http://10.0.2.2:8000
          cp build/app/outputs/flutter-apk/app-profile.apk app-profile.apk
      - name: Build again with a planted bug (for the catch check)
        run: |
          flutter build apk --profile --dart-define=API_URL=http://10.0.2.2:8000 --dart-define=PLANTED_BUG=total
          cp build/app/outputs/flutter-apk/app-profile.apk app-profile-bug-total.apk
      - uses: actions/upload-artifact@v7
        with:
          name: apk
          path: |
            app-profile.apk
            app-profile-bug-total.apk
          retention-days: 7

  android:
    name: "Android: ${{ matrix.framework }}"
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        framework: [appium, maestro]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: booking
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      APK: ${{ github.workspace }}/app-profile.apk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: apk
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Start the booking API (api-performance-lab)
        run: |
          pip install "git+https://github.com/Kurtis-H/api-performance-lab"
          python -m app.seed --events 14 --seats 12 --users 60
          PYTHONUNBUFFERED=1 RATE_LIMIT_PER_MINUTE=0 nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf "$API_URL/health" && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Install ${{ matrix.framework }} (timed)
        run: python scripts/measure.py setup --framework ${{ matrix.framework }} -- bash scripts/ci/setup.sh ${{ matrix.framework }}
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the test plan ${{ env.RUNS }} times on an emulator (timed)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          cores: 4
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put global hide_error_dialogs 1 || true
            adb install -r "$APK"
            # Untimed warm-up for both, so neither first run pays one-off driver setup.
            if [ "${{ matrix.framework }}" = maestro ]; then timeout 4m "$HOME/.maestro/bin/maestro" test mobile/maestro/common/warm_up.yaml || echo "warm-up didn't finish; carrying on"; fi
            if [ "${{ matrix.framework }}" = appium ]; then (cd mobile/appium && timeout 4m npx wdio run wdio.conf.ts --spec test/warm_up.e2e.ts) || echo "warm-up didn't finish; carrying on"; fi
            python scripts/measure.py run --framework ${{ matrix.framework }} --runs "$RUNS" -- bash "$GITHUB_WORKSPACE/scripts/ci/run.sh" ${{ matrix.framework }}
            # Catch check: swap in the bugged build, then exactly S3 must fail.
            # Uninstall first: Appium re-signs apps it installs, so the bugged
            # build can't be installed over its copy.
            adb uninstall dev.kurtish.booking_mobile || true
            adb install "$GITHUB_WORKSPACE/app-profile-bug-total.apk"
            APK="$GITHUB_WORKSPACE/app-profile-bug-total.apk" python scripts/measure.py catch --framework ${{ matrix.framework }} --expect-fail S3 -- bash "$GITHUB_WORKSPACE/scripts/ci/run.sh" ${{ matrix.framework }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: results-${{ matrix.framework }}
          path: |
            results/
            api.log
            mobile/appium/*.log
            mobile/maestro/maestro-output/

  report:
    name: Report
    needs: [web, android]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: results-*
          path: artifacts
      - name: Collect every framework's results
        run: |
          mkdir -p results
          find artifacts -path '*/results/*.json' -exec cp {} results/ \;
          ls -la results
      - name: Write RESULTS.md
        env:
          RESULTS_SOURCE: "[workflow run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}), ${{ env.RUNS }} runs per framework"
        run: python scripts/report.py --results results --out RESULTS.md
      - uses: actions/upload-artifact@v7
        with:
          name: RESULTS
          path: |
            RESULTS.md
            results/
